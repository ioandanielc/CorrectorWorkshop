# OlgaInitExperiment: kdtree corrector, 3D n50 model. The violations here are
# sparse (a handful of too-close pairs in N=5096), which is exactly the kdtree
# corrector's regime — expect it to be much faster than the grid.
#   .venv\Scripts\python.exe src/inference/experiments/olga_init/olga_init_experiment.py src/configs/experiments/olga_init/n50_kdtree.yaml

model:
  checkpoint: src/models/weights/model9_3d_n50.pt
  config:     src/configs/training/model/model_config_9_3d_n50.yaml
  rd_train:   0.15

data:
  input:   artifacts/inference/experiments/olga_init/data/data.npy
  box:     18.0
  rd_test: 0.6    # see n50_grid.yaml for the choice of 0.6

kdtree:
  total_core: 50   # ≈ N_train of the checkpoint
  inner_core: 12

experiment:
  corrector: kdtree
  k_kdtree:  10    # cap — stops early once no pairs < rd_test remain
  device:    cpu
