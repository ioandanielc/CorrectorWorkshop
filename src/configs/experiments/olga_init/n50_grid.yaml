# OlgaInitExperiment: grid corrector, 3D n50 model.
#   .venv\Scripts\python.exe src/inference/experiments/olga_init/olga_init_experiment.py src/configs/experiments/olga_init/n50_grid.yaml

model:
  checkpoint: src/models/weights/model9_3d_n50.pt
  config:     src/configs/training/model/model_config_9_3d_n50.yaml
  rd_train:   0.15

data:
  input:   artifacts/inference/experiments/olga_init/data/data.npy   # (N, 6): x y z vx vy vz — N=5096, LJ units
  box:     18.0                      # cubic box edge L
  rd_test: 0.6    # target min pair distance. 0.6 puts the cloud at ~13% of FCC
                  # max density — the regime the 3D checkpoints trained at.
                  # Raise toward 0.9 (LJ RDF onset at T=1.4) for stronger
                  # separation; watch the ghost_width warning when raising.

tiling:
  n_cells:      7     # 5096/7^3 ≈ 15 core/tile; ×(1+2·0.25)^3 ≈ 50 total ≈ N_train
  ghost_factor: 0.25  # ghost_width = 0.25 · 18/7 ≈ 0.64 ≥ rd_test

experiment:
  corrector: grid     # grid | kdtree | grid_then_kdtree
  k_grid:    5
  device:    cpu
