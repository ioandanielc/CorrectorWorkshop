# ObstructionExperiment corrector config: model12 grid corrector, 6x6 tiling.
# Referenced by ObstructionExperimentConfig.corrector_config (src/inference/experiments/obstruction/obstruction_experiment.py).
# Corrector blocks only — the experiment overrides rd_test (with its own rd)
# and device at runtime, and generates its own point clouds.
#
# RETARGETED from the removed model9_n100_p050 to model12_sph_l4 (2026-07-21)
# — NOT yet re-run/tuned; the planned obstruction re-run will validate tiling
# and ghost_factor for this checkpoint.

model:
  checkpoint: src/models/weights/model12_sph_l4.pt
  config:     src/configs/training/model/model_config_12_sph_L4.yaml
  rd_train:   0.14

data:
  rd_test:    0.02   # overridden by ObstructionExperimentConfig.rd

tiling:
  n_cells:      6
  ghost_factor: 0.13  # ghost_width = ghost_factor * cell_size

experiment:
  device: cpu        # overridden by ObstructionExperimentConfig.device
