# SPHTVExperiment config: 10x10 tiling with the N=50 sparse model
#   .venv\Scripts\python.exe src/inference/experiments/sph_tv/sph_tv_experiment.py src/configs/experiments/sph_tv/grid_10x10.yaml
# ~49 pts/tile (25 core + 24 ghost) matches training distribution N=50.
# Scale = rd_train / rd_test = 0.05 / 0.02 = 2.5

model:
  checkpoint: src/models/weights/model9_n50_sparse.pt
  config:     src/configs/training/model/model_config_9.yaml
  rd_train:   0.05

data:
  without_tv: artifacts/inference/experiments/sph_tv/data/positions_without.npy
  with_tv:    artifacts/inference/experiments/sph_tv/data/positions.npy
  rd_test:    0.02

tiling:
  # 10x10 — recommended for N=50 models (n50_sparse).
  # Total pts/tile ~49 (25 core + 24 ghost) matches training distribution N=50.
  n_cells:      10
  ghost_factor: 0.22  # ghost_width = ghost_factor * cell_size; cell_size=1/10 -> width~0.022 (>rd_test, with margin)

experiment:
  stride:   100
  k_values: [1, 2, 3, 5]
  device:   cpu

tv:
  h_factor: 1.3   # h = h_factor * dx,  dx = domain / sqrt(N)
  nmax:     10
  dt:       0.2   # relaxation factor (matches colleague reference code)
