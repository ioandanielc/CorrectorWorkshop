# SPHModel12Experiment config: grid-only, model12 (SPH kernel-gradient corrector)
#   .venv\Scripts\python.exe src/inference/experiments/sph_tv/sph_model12_experiment.py src/configs/experiments/sph_tv/model12_grid.yaml
#
# Sizing note — KG-driven (supersedes the first-cut attention_rd sizing):
#   scale = rd_train / rd_test = 0.14 / 0.02 = 7.0
#   The binding length for a symmetry (KG) model is NOT rd_test or attention_rd
#   but the SPH kernel support 3h = 6*dx = 0.12 (dx = real spacing = 0.02).
#   Per-tile symmetrization only survives the tile seams if the core+ghost patch
#   is large relative to that support — a tile smaller than the support cannot
#   arrange a KG neighbourhood, and independent tiles disagree at the seam.
#   Empirically (n_cells sweep, t=500/1000): KG-after drops BELOW raw once tile
#   width >= support. n_cells=7 (tile 0.143 > 0.12) -> KG 0.244/0.140, at/below
#   the TV reference (0.365/0.141); ~184 pts/tile with ghost_factor=0.45, safely
#   under model12's ~250 dense-edge ceiling. (n_cells=6 is marginally better on
#   KG but sits at the ceiling.) This tiled config is the interim result; the
#   real fix is a sparse whole-cloud pass that removes seams entirely.

model:
  checkpoint: src/models/weights/model12_sph_l4.pt
  config:     src/configs/training/model/model_config_12_sph_L4.yaml
  rd_train:   0.14   # constraint rd (NOT attention_rd — read automatically from model config)

data:
  without_tv: artifacts/inference/experiments/sph_tv/data/positions_without.npy
  rd_test:    0.02

tiling:
  n_cells:      7
  ghost_factor: 0.45

experiment:
  corrector: grid
  k_grid:    5
  stride:    200
