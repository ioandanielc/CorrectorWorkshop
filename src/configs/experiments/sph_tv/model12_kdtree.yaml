# SPHModel12Experiment config: kdtree-only, model12 (SPH kernel-gradient corrector)
#   .venv\Scripts\python.exe src/inference/experiments/sph_tv/sph_model12_experiment.py src/configs/experiments/sph_tv/model12_kdtree.yaml
#
# Sizing note: same attention_rd constraint as model12_grid.yaml (receptive
# field ~0.041 in test-cloud units, vs rd_test=0.02) — but the kdtree
# corrector's frozen-ring check only validates against rd_test, so total_core
# is sized generously (not just ~N_train=49) to keep the ring comfortably
# thicker than 0.041 too. At this data's density (rho~2500/unit^2):
#   total_core=80 -> neighbourhood radius ~0.101
#   inner_core=18 -> inner radius ~0.048
#   ring ~0.053 (> 0.041, ~30% margin)
# First-cut sizing, not yet empirically tuned against real SPH data.

model:
  checkpoint: src/models/weights/model12_sph_l4.pt
  config:     src/configs/training/model/model_config_12_sph_L4.yaml
  rd_train:   0.14   # constraint rd (NOT attention_rd — read automatically from model config)

data:
  without_tv: artifacts/inference/experiments/sph_tv/data/positions_without.npy
  rd_test:    0.02

kdtree:
  total_core: 80
  inner_core: 18

experiment:
  corrector: kdtree
  k_kdtree:  10
  stride:    200
