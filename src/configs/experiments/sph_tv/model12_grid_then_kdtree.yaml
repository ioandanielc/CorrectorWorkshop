# SPHModel12Experiment config: grid then kdtree composition, model12
#   .venv\Scripts\python.exe src/inference/experiments/sph_tv/sph_model12_experiment.py src/configs/experiments/sph_tv/model12_grid_then_kdtree.yaml
#
# Same tiling/kdtree sizing as model12_grid.yaml / model12_kdtree.yaml —
# see those files for the attention_rd margin reasoning. Grid pass(es) first
# to clean up broad structure, then kdtree pass(es) to mop up residual
# violations — the best-composing combination measured on 2D SPH data.

model:
  checkpoint: src/models/weights/model12_sph_l4.pt
  config:     src/configs/training/model/model_config_12_sph_L4.yaml
  rd_train:   0.14   # constraint rd (NOT attention_rd — read automatically from model config)

data:
  without_tv: artifacts/inference/experiments/sph_tv/data/positions_without.npy
  rd_test:    0.02

tiling:
  n_cells:      10
  ghost_factor: 0.45

kdtree:
  total_core: 80
  inner_core: 18

experiment:
  corrector: grid_then_kdtree
  k_grid:    5
  k_kdtree:  10
  stride:    200
