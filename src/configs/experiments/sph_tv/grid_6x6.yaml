# SPHTVExperiment config: 6x6 tiling with the N=100 packed model
#   .venv\Scripts\python.exe src/inference/experiments/sph_tv/sph_tv_experiment.py src/configs/experiments/sph_tv/grid_6x6.yaml
# ~107 pts/tile (69 core + 38 ghost) matches training distribution N~100.
# Scale = rd_train / rd_test = 0.076 / 0.02 = 3.8

model:
  checkpoint: src/models/weights/model9_n100_p050.pt
  config:     src/configs/training/model/model_config_9_n100_p050.yaml
  rd_train:   0.076

data:
  without_tv: artifacts/inference/experiments/sph_tv/data/positions_without.npy
  with_tv:    artifacts/inference/experiments/sph_tv/data/positions.npy
  rd_test:    0.02

tiling:
  # 6x6 — recommended for N=100 models (n100_p050).
  # Total pts/tile ~107 (69 core + 38 ghost) matches training distribution N~100.
  n_cells:      6
  ghost_factor: 0.13  # ghost_width = ghost_factor * cell_size; cell_size~1/6 -> width~0.0217 (>rd_test, with margin)

experiment:
  stride:   100
  k_values: [1, 2, 3, 5]
  device:   cpu

tv:
  h_factor: 1.3   # h = h_factor * dx,  dx = domain / sqrt(N)
  nmax:     10
  dt:       0.2   # relaxation factor (matches colleague reference code)
