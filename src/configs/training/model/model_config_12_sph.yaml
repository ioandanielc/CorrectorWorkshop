architecture: iterative_message_passing_corrector
model_file: models/architectures/model12/model12

hidden_dim: 128
num_layers: 3             # message-passing rounds — receptive field ~ 3 * attention_rd
norm: layer
activation: GELU
max_displacement: 0.168   # 1.2 * constraint rd = 0.14

# Attention radius passed to the model at every call (part of the checkpoint's
# calling convention). 0.286 = 2*dx = h: first two neighbour shells; with
# num_layers 3 the receptive field spans ~0.86 of the unit box.
attention_rd: 0.286
