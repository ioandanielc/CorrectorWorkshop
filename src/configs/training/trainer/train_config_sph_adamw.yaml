# The model12_sph_l4 trainer recipe — the AdamW winner of the 2026-07-15
# optimizer sweep (the Adam arm, train_config_sph.yaml, was purged; its exact
# config survives in the sweep runs' configs/ snapshots and on main).
# Why AdamW won — decoupled weight decay (vs. Adam's L2-into-gradient decay)
# fixed the late-training regression observed in runs A-F (2026-07-15):
# loss/eval metrics peak ~iter 6000 then worsen by iter 10000 even as LR
# anneals toward eta_min. Hypothesis: Adam's L2 weight_decay gets renormalized
# by the shrinking per-parameter variance (v) once task gradients die down,
# so its effective step doesn't vanish with LR the way AdamW's decoupled
# decay (lr * wd * param, scaled only by LR) does.
batch_size: 32
num_iterations: 10000
initialization: xavier_uniform
device: cuda
unroll_steps: 5

# Torch seed for model initialisation. Set because this recipe has a degenerate
# mode — roughly half of some architecture variants collapse into a saturated
# uniform translation, and which one you get depends only on the init. Leaving it
# unseeded makes every run a coin flip and makes results irreproducible. Override
# per run with --seed to sample the distribution deliberately.
# NOTE: the shipped model12_sph_l4.pt predates this and was trained unseeded, so
# re-running will not reproduce that exact checkpoint (it never would have).
seed: 0

optimizer:
  name: AdamW
  params:
    lr: 0.001
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]

lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 10000
    eta_min: 1.0e-6

eval:
  validation_size: 256
  num_visual_samples: 6
  log_interval: 100
  sample_interval: 500
