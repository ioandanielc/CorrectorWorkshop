# SPH-loss runs (2D, N=49 periodic lattice, rd=0.14) — mirrors train_config_3d.
# batch 32 at N=49 -> ~77k pairwise edges, far below the proven VRAM budget.
batch_size: 32
num_iterations: 10000
initialization: xavier_uniform
device: cuda
unroll_steps: 5   # deeper correction policy — coordinated rearrangement at 83%
                  # packing needs more sequential passes than the standard 3

optimizer:
  name: Adam
  params:
    lr: 0.001
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]

lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 10000
    eta_min: 1.0e-6

eval:
  validation_size: 256
  num_visual_samples: 6
  log_interval: 100
  sample_interval: 500
