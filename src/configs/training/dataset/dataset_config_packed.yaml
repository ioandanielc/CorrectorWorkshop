type: packed

# packedness = fraction of triangular-lattice max density
# At rd=0.05: packedness=0.5 → N_target ≈ 231 points (vs 50 for standard config)
# This is the hard regime: nearly every step has conflicts, no free space to spread into.
packedness: 0.5

dim: 2
rd: 0.05
seed: 42
noise_scale_min: 0.0    # includes clean clouds — model must learn to be idle when legal
noise_scale_max: 0.02   # 0.4 * rd — lighter than standard (0.6*rd) since packed clouds
                        # have much less slack and large noise creates unsolvable clusters
