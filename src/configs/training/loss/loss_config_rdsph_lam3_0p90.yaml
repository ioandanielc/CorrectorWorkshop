name: rdsph_loss

# Sweep variant of loss_config_rdsph.yaml: lambda3 0.09 -> 0.90.
# Symmetry term ~10:1 against the violation term at init (baseline is ~1:1).

params:
  lambda1: 7.14       # 1 / rd, rd = 0.14
  lambda1_quad: 0
  lambda2: 0.0149     # 0.1 * lambda1 / (N-1), N = 49
  lambda3: 0.90

  h_factor: 2.0       # h = h_factor * dx, dx = box / sqrt(N) = lattice spacing
  box:      1.0       # unit torus
