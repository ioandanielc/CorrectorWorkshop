# -- Training --
batch_size: 2
num_iterations: 5
initialization: xavier_uniform
device: cpu

# -- Optimizer --
optimizer:
  name: Adam
  params:
    lr: 0.001
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]

# -- LR Scheduler --
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 5
    eta_min: 1.0e-6

# -- Eval --
eval:
  validation_size: 6
  num_visual_samples: 6
  log_interval: 1
  sample_interval: 2
