# cutoff_rd sweep: 3.0 * spacing — 3.0x the lattice spacing.
# Kernel support 0.428571; reach = 4 * cutoff = 1.7143 (1.71 of the unit box).
# CONFOUND: reach moves with the width, since reach = L * cutoff_rd.
# Separating the two needs L adjusted to hold reach constant — not run.
architecture: iterative_message_passing_corrector
model_file: models/architectures/model12/model12

hidden_dim: 128
num_layers: 4
norm: layer
activation: GELU
max_displacement: 0.168

cutoff_rd: 0.428571
