# Architecture bridge rung: noperiod.
# Minimum image disabled. Isolates the value of wrap geometry; the model
# now sees the torus as a bounded box and misses every seam pair.
#
# Parameter-matched to model12 (350,594) within 0.3%; run with the
# production dataset/loss/trainer configs so only the mechanism differs.
architecture: model12_ablate
model_file: models/architectures/model12_ablate/model12_ablate

hidden_dim: 128
num_layers: 4
norm: layer
activation: GELU
max_displacement: 0.168
cutoff_rd: 0.286

graph: radius
weight: kernel
aggregation: wsum
periodic: false
