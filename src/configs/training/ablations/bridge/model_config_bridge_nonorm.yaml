# Architecture bridge rung: nonorm.
# Kernel-weighted MEAN -> unnormalised SUM. Isolates per-particle
# normalisation, which is what makes node states independent of
# neighbour count and is suspected to drive size transfer.
#
# Parameter-matched to model12 (350,594) within 0.3%; run with the
# production dataset/loss/trainer configs so only the mechanism differs.
architecture: model12_ablate
model_file: models/architectures/model12_ablate/model12_ablate

hidden_dim: 128
num_layers: 4
norm: layer
activation: GELU
max_displacement: 0.168
cutoff_rd: 0.286

graph: radius
weight: kernel
aggregation: sum
periodic: true
