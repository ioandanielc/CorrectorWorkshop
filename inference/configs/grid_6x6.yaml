# Experiment config: 6x6 tiling with the N=100 packed model
# ~107 pts/tile (69 core + 38 ghost) matches training distribution N~100.
# Scale = rd_train / rd_test = 0.076 / 0.02 = 3.8

model:
  checkpoint: weights/n100_p050.pt
  config:     configs/model_configs/model_config_9_n100_p050.yaml
  rd_train:   0.076

data:
  without_tv: inference/sph_data/positions_without.npy
  with_tv:    inference/sph_data/positions.npy
  rd_test:    0.02
  domain:     1.0

tiling:
  # 6x6 — recommended for N=100 models (n100_p050).
  # Total pts/tile ~107 (69 core + 38 ghost) matches training distribution N~100.
  grid_size:    6
  ghost_factor: 1.0   # ghost_width = ghost_factor * rd_test (minimum provably correct)

experiment:
  stride:   100
  k_values: [1, 2, 3, 5]
  device:   cpu
