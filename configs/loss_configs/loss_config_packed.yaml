name: hybrid_loss

params:
  # ── Principled calibration for packed regime (N≈231, rd=0.05) ────────────
  #
  # lambda1: same as standard — normalised so lambda1 * rd = 1.0.
  #   rd-independent, no change needed.
  lambda1: 20

  # lambda1_quad: disabled (same reasoning as loss_config_5).
  lambda1_quad: 0

  # lambda2: re-derived for N=231.
  #   Break-even condition: lambda2 < lambda1 / (N-1) = 20 / 230 ≈ 0.087
  #   We set lambda2 = 0.1 * (lambda1 / (N-1)) ≈ 0.0087
  #   Keeps the 10x violation-preference ratio, scaled to N=231.
  lambda2: 0.0087
