name: hybrid_loss

# lambda1/lambda2 are computed live each iteration by the trainer from the current
# batch's rd (see training/trainer.py's dynamic_rd_scaling branch), since a fixed
# lambda1 = 1/rd baked into this config would only be correct for one rd.
dynamic_rd_scaling: true

params:
  # lambda1 = lambda1_coeff / rd   (same "lambda1 * rd = 1.0" principle as loss_config_5 /
  #                                 loss_config_packed, just evaluated per-iteration)
  lambda1_coeff: 1.0

  # lambda1_quad: disabled (same reasoning as loss_config_5 / loss_config_packed).
  lambda1_quad: 0

  # lambda2 = lambda1 / (N-1) * lambda2_ratio   (N read live from the batch each
  #                                              iteration; keeps the 10x violation-
  #                                              preference ratio regardless of N or rd)
  lambda2_ratio: 0.1
