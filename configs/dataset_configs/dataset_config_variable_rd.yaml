type: variable_rd_packed

# Clouds are generated at the fixed, always-safe rd_gen (packedness formula clipped to
# [n_min, n_max] -- same regime as dataset_config_packed.yaml / n50_sparse), then uniformly
# rescaled by rd_target/rd_gen where rd_target is resampled log-uniformly in
# [rd_min, rd_max] on every generate_sample() call. See VariableRdPackedPoissonDiskDataset
# in data/data_generator.py for why (directly sampling at large rd in a fixed [0,1]^dim
# domain is physically infeasible for most of this range).
rd_gen: 0.05
packedness: 0.11   # -> N~50 at rd_gen=0.05 (matches the n50_sparse checkpoint regime)
n_min: 50          # pointcloud size for the start of training
n_max: 50

rd_min: 0.01
rd_max: 1.0

# Every cloud is generated at the same rd_gen/packedness/N, so generation doesn't need to
# be repeated every iteration: a pool of pool_size base clouds is pre-generated once (in
# parallel across CPU cores), and generate_sample() just samples + rescales from it —
# this is what makes large batch sizes actually GPU-bound instead of scipy-CPU-bound.
pool_size: 100000

dim: 2
seed: 42

# noise scale as a FRACTION of rd_target (not an absolute value — rd spans 100x)
noise_scale_min_frac: 0.0    # includes clean clouds — model must learn to be idle when legal
noise_scale_max_frac: 0.4    # matches the 0.4*rd noise level used in dataset_config_packed.yaml
