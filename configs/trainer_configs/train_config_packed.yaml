# -- Training --
# batch_size reduced from 64 to 8:
# O(N^2) edge memory at N≈231 vs N=50 is ~21x larger per cloud.
# 8 clouds * 231^2 edges ≈ 426k pairs (vs 64 * 50^2 = 160k) — fits comfortably in VRAM.
batch_size: 8
num_iterations: 10000
initialization: xavier_uniform
device: cuda
unroll_steps: 3

# -- Optimizer --
optimizer:
  name: Adam
  params:
    lr: 0.001
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]

# -- LR Scheduler --
lr_scheduler:
  name: LinearLR
  params:
    start_factor: 1.0
    end_factor: 0.001
    total_iters: 10000

# -- Eval --
eval:
  validation_size: 64    # fewer than standard (256) due to O(N^2) memory
  num_visual_samples: 6
  log_interval: 100
  sample_interval: 500
