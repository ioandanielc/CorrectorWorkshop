# -- Training --
batch_size: 64          # RTX 4080 SUPER has plenty of VRAM; larger batch = more stable BN stats
num_iterations: 10000
initialization: xavier_uniform
device: cuda

# -- Optimizer --
optimizer:
  name: Adam
  params:
    lr: 0.001
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]

# -- LR Scheduler --
lr_scheduler:
  name: LinearLR
  params:
    start_factor: 1.0
    end_factor: 0.001   # 1e-3 -> 1e-6 over total_iters
    total_iters: 10000

# -- Eval --
eval:
  validation_size: 256
  num_visual_samples: 6
  log_interval: 100
  sample_interval: 100
