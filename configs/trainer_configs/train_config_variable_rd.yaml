# -- Training --
# batch_size=1024 measured at ~9.1GB/17GB peak VRAM at N=50 (RTX 4080 Super) — pointclouds
# are small (N=50) for the start of training, so batch size can be pushed much higher than
# the N=231/250 regime (train_config_packed.yaml's bs=8) while keeping ~45% VRAM headroom.
batch_size: 1024
num_iterations: 10000
initialization: xavier_uniform
device: cuda
unroll_steps: 3

# -- Optimizer --
optimizer:
  name: Adam
  params:
    lr: 0.001
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]

# -- LR Scheduler --
lr_scheduler:
  name: LinearLR
  params:
    start_factor: 1.0
    end_factor: 0.001
    total_iters: 10000

# -- Eval --
eval:
  validation_size: 64
  num_visual_samples: 6
  log_interval: 100
  sample_interval: 500
