# 10x10 tiling — recommended for N=50 models (n50_sparse)
# Total pts/tile ≈ 49 (25 core + 24 ghost) matches training distribution N=50.

name:        "10x10"
grid_size:   10
ghost_factor: 1.0   # ghost_width = ghost_factor * rd_test (minimum provably correct)

# At SPH conditions (N=2500, rd_test=0.02, domain=[0,1]^2):
#   cell_size       = 0.100
#   core pts/tile   ~ 25
#   ghost pts/tile  ~ 24
#   total pts/tile  ~ 49    <-- matches N=50 training distribution
