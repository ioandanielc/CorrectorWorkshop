architecture: violation_weighted_edge_network_v2
model_file: models/fixed_rd/model9

hidden_dim: 128
norm: layer
activation: GELU

# Output clamping: displacement per step is bounded to [-max_displacement, +max_displacement]
# per coordinate via tanh. Set to ~1.2 * rd to allow full correction of a near-zero-distance
# pair while preventing cascade overcorrections in packed clouds.
max_displacement: 0.06   # 1.2 * rd=0.05
