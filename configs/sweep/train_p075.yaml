batch_size: 8
device: cuda
eval:
  log_interval: 100
  num_visual_samples: 6
  sample_interval: 500
  validation_size: 28
initialization: xavier_uniform
lr_scheduler:
  name: LinearLR
  params:
    end_factor: 0.001
    start_factor: 1.0
    total_iters: 10000
num_iterations: 10000
optimizer:
  name: Adam
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.001
    weight_decay: 0.0001
unroll_steps: 3
