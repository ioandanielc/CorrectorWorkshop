batch_size: 32
device: cuda
eval:
  log_interval: 100
  num_visual_samples: 6
  sample_interval: 500
  validation_size: 200
initialization: xavier_uniform
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 10000
    eta_min: 1.0e-6
num_iterations: 10000
optimizer:
  name: Adam
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.001
    weight_decay: 0.0001
unroll_steps: 3
